[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/alicankuklaci/loadfleet"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
loadfleet-plan = { path = "crates/plan" }
loadfleet-health = { path = "crates/health" }
loadfleet-metrics = { path = "crates/metrics" }
loadfleet-engine = { path = "crates/engine" }
loadfleet-scenario = { path = "crates/scenario" }
loadfleet-testserver = { path = "crates/testserver" }
loadfleet-protocol = { path = "crates/protocol" }
loadfleet-server = { path = "crates/server" }
loadfleet-agent = { path = "crates/agent" }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
http = "1"
hyper = { version = "1.6", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.10", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["ws", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hdrhistogram = "7.5"
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
humantime-serde = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
cpu-time = "1"
rlimit = "0.10"
rust-embed = "8.5"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
ipnet = "2"
url = "2"
thiserror = "2"
anyhow = "1"
argon2 = "0.5"
sha2 = "0.11"
hex = "0.4"
parking_lot = "0.12"
assert_cmd = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }

# argon2 (admin login) is ~50x slower unoptimized; debug builds and tests keep it optimized
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
